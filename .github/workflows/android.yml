name: Build MeshMsg APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostrar estrutura do repositório (antes de extrair)
        run: find . -maxdepth 3 -not -path "./.git/*"

      - name: Extrair o zip do projeto
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          echo "Arquivo zip encontrado: $ZIP_FILE"
          if [ -z "$ZIP_FILE" ]; then
            echo "Nenhum .zip encontrado na raiz nem em subpastas de 1 nível. Abortando."
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted

      - name: Mostrar estrutura extraída
        run: find extracted -maxdepth 5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.7
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name "settings.gradle.kts" | head -n 1)")
          echo "Pasta do projeto encontrada: $PROJECT_DIR"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Não encontrei settings.gradle.kts dentro do zip extraído."
            exit 1
          fi
          cd "$PROJECT_DIR"
          /tmp/gradle-8.7/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshMsg-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
